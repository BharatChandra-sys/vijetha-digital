name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check app tests --config pyproject.toml

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vijetha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL:            postgresql+psycopg2://postgres:postgres@localhost:5432/vijetha_test
      FRONTEND_URL:            http://localhost:5173
      JWT_SECRET_KEY:          test-secret-key-for-ci
      ADMIN_EMAIL:             admin@example.com
      ADMIN_PASSWORD:          Admin123!
      CLOUDINARY_CLOUD_NAME:   test
      CLOUDINARY_API_KEY:      test
      CLOUDINARY_API_SECRET:   test
      RAZORPAY_KEY_ID:         test
      RAZORPAY_KEY_SECRET:     test
      RAZORPAY_WEBHOOK_SECRET: test
      REDIS_URL:               redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests -q --tb=short

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest tests --cov=app --cov-report=term --cov-report=xml --cov-fail-under=70

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
